<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도시 스노글로브 · 노을 비행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@200;300;400;600;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141019; --panel:#1e1826; --line:#332a40; --ink:#f4ebe1; --mute:#a99bb8; --accent:#ff8a6b; --accent-2:#c9a3df;
  --fw:360px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{ --bg:#f4eee8; --panel:#fffaf5; --line:#e3d6cb; --ink:#2b2130; --mute:#6f6178; --accent:#e2603f; --accent-2:#7a56a8; }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){ --bg:#f4eee8; --panel:#fffaf5; --line:#e3d6cb; --ink:#2b2130; --mute:#6f6178; --accent:#e2603f; --accent-2:#7a56a8; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{height:100vh;height:100dvh}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
header{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 12px 6px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
.tab{
  appearance:none;border:0;background:transparent;color:var(--mute);cursor:pointer;
  font:500 14px/1 "Noto Sans KR",system-ui,sans-serif;padding:10px 18px;border-radius:999px;
  display:flex;align-items:baseline;gap:8px;transition:background .18s,color .18s;
}
.tab small{font-weight:300;font-size:11px;opacity:.8}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px;position:relative}
.frame{
  position:relative;width:225px;height:400px;border-radius:20px;overflow:hidden;background:#0b0710;
  box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);
}
.frame canvas{display:block;width:100%;height:100%}
.fail{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;
  background:linear-gradient(160deg,#2a1f38,#171021);color:#f4ebe1;font-size:14px;line-height:1.6;
}
.fail.on{display:flex}
.fail b{display:block;font-size:16px;margin-bottom:6px}
footer{width:max(var(--fw),320px);max-width:100%;margin:0 auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-height:52dvh;overflow-y:auto;overscroll-behavior:contain}
.stack{display:grid;gap:8px}
.seg{display:flex;gap:6px;flex:1}
.cbtn{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:500 13px/1 "Noto Sans KR",system-ui,sans-serif;padding:10px 4px;border-radius:12px;transition:background .15s,border-color .15s}
.cbtn:hover{border-color:var(--accent-2)}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{flex-wrap:wrap}
.field{flex:1 1 150px}
@media (max-width:440px){ .tab small{display:none} .tab{padding:10px 13px} header{padding:8px 8px 4px} .btn{padding:10px 11px} .time{min-width:64px} .field label{font-size:11px} }
.row{display:flex;align-items:center;gap:8px}
.btn{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
  font:500 13px/1 "Noto Sans KR",system-ui,sans-serif;padding:10px 14px;border-radius:12px;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#2a0f08}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seek{flex:1;min-width:0;accent-color:var(--accent);height:22px;margin:0}
.time{font:400 12px/1 "Outfit","Noto Sans KR",sans-serif;color:var(--mute);min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.field label{font-size:12px;color:var(--mute);white-space:nowrap}
.field input{
  flex:1;min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;font:400 14px/1.2 "Noto Sans KR",system-ui,sans-serif;
}
.status{min-height:16px;font-size:12px;color:var(--mute);line-height:1.4}
[hidden]{display:none !important}
@media (max-height:640px){ header{padding:6px 10px 2px} .tab{padding:8px 14px} footer{gap:6px;padding-top:4px} }
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist" aria-label="장면 선택">
    <button class="tab" role="tab" id="tab-globe" aria-selected="true" data-scene="globe">스노글로브 <small>8초</small></button>
    <button class="tab" role="tab" id="tab-sunset" aria-selected="false" data-scene="sunset">노을 비행 <small>10초</small></button>
  </div>
</header>

<main id="stage">
  <div class="frame" id="frame">
    <canvas id="out" width="540" height="960" aria-label="3D 애니메이션 영상 영역"></canvas>
    <div class="fail" id="fail" role="alert"><div><b>3D 엔진을 불러오지 못했어요</b>네트워크 연결을 확인하고 새로고침해 주세요.<br>(Three.js CDN 로드 실패)</div></div>
  </div>
</main>

<footer id="controls">
  <div class="row">
    <button class="btn primary" id="btnPlay" type="button">일시정지</button>
    <button class="btn" id="btnReplay" type="button">다시 재생</button>
    <input class="seek" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="재생 위치">
    <span class="time" id="time">0.0 / 10.0초</span>
  </div>
  <div class="row" id="fieldSunset" hidden>
    <div class="field"><label for="inSunset">영상 속 문구</label><input id="inSunset" type="text" maxlength="28" autocomplete="off" spellcheck="false" placeholder="TAKE A BREATH"></div>
  </div>
  <div class="stack" id="fieldGlobe">
    <div class="row"><div class="seg" role="group" aria-label="도시 선택">
      <button class="cbtn" type="button" data-city="seoul" aria-pressed="true">서울</button>
      <button class="cbtn" type="button" data-city="paris" aria-pressed="false">파리</button>
      <button class="cbtn" type="button" data-city="tokyo" aria-pressed="false">도쿄</button>
      <button class="cbtn" type="button" data-city="newyork" aria-pressed="false">뉴욕</button>
    </div></div>
    <div class="row">
      <div class="field"><label for="inCity">각인 문구</label><input id="inCity" type="text" maxlength="14" autocomplete="off" spellcheck="false" placeholder="SEOUL"></div>
      <button class="btn" id="btnShake" type="button">눈 흔들기</button>
    </div>
  </div>
  <div class="row">
    <button class="btn" id="btnRec" type="button">WebM 저장</button>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
</footer>

<script>
/* =====================================================================
   CONFIG — 색감·문구·길이를 여기서 바꾸세요. (색상은 모두 sRGB 헥스)
   ===================================================================== */
const CONFIG = {
  sunset: {
    duration: 10,                 // 초 (루프 길이)
    text: 'TAKE A BREATH',        // 영상 속 작은 문구
    altitude: 10,                 // 비행 고도
    palette: {
      skyTop:'#241a5a', skyMid:'#8259ad', skyHorizon:'#ff9f7c', sun:'#ffd29a',
      seaDeep:'#1f1a4a', seaMid:'#4e3f8a', seaGlow:'#ff8a6c',
      fog:'#e59a8e',
      cloudLilac:{ lit:'#f4d9f0', mid:'#c9a6da', shadow:'#7b689f' },
      cloudPeach:{ lit:'#fff0d8', mid:'#ffc3a8', shadow:'#c47e9f' },
      planeCream:'#f6e9d1', planeCoral:'#ff6f57', planeDark:'#56394f', planeWheel:'#36283a',
      gradeTop:'#6a52b8', gradeBottom:'#ff9a72', vignette:'#25123a'
    }
  },
  globe: {
    duration: 8,
    cityKey: 'seoul',              // seoul | paris | tokyo | newyork
    city: 'SEOUL',                // 받침대에 새겨지는 도시 표기
    snowCount: 950,
    palette: {
      bg:'#1b110d', floor:'#34201a', pedestal:'#eddcc2', collar:'#d8c2a3',
      key:'#ffcf9a', rim:'#ffb488', fill:'#ffe4c6', hemiSky:'#ffdcb8', hemiGround:'#2a150e',
      snow:'#fff4e6', roofTile:'#4a5566', pine:'#2c5a49', windowGlow:'#ffb45e',
      labelInk:'#6a4330', gradeColor:'#ffb066', vignette:'#0c0504'
    }
  }
};

/* =====================================================================
   라이브러리 로드 (cdnjs → jsDelivr 순서, 실패 시 메시지)
   ===================================================================== */
(function loader(){
  const urls=[
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
  ];
  function load(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
  (async()=>{
    for(const u of urls){ try{ await load(u); if(window.THREE) break; }catch(e){} }
    if(!window.THREE){ document.getElementById('fail').classList.add('on'); document.getElementById('btnRec').disabled=true; return; }
    try{ start(); }catch(err){
      console.error(err);
      const f=document.getElementById('fail'); f.querySelector('div').innerHTML='<b>장면을 시작하지 못했어요</b>WebGL을 사용할 수 없는 환경일 수 있어요.<br>다른 브라우저에서 열어 보세요.';
      f.classList.add('on');
    }
  })();
})();

function start(){
'use strict';
/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sstep=(a,b,x)=>{ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); };
const mix=(a,b,t)=>a+(b-a)*t;
const mod=(a,n)=>((a%n)+n)%n;
const C=h=>new THREE.Color(h).convertSRGBToLinear();
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rgba(hex,a){ const c=new THREE.Color(hex); return `rgba(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)},${a})`; }
function srgbTex(canvas){ const t=new THREE.CanvasTexture(canvas); t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; }
function std(hex,rough=.6,metal=0,extra){ return new THREE.MeshStandardMaterial(Object.assign({color:C(hex),roughness:rough,metalness:metal},extra||{})); }
function drawSpaced(g,text,cx,y,sp){
  const chars=[...text]; const ws=chars.map(c=>g.measureText(c).width);
  const total=ws.reduce((a,b)=>a+b,0)+sp*Math.max(0,chars.length-1);
  let x=cx-total/2; g.textAlign='left'; chars.forEach((c,i)=>{ g.fillText(c,x,y); x+=ws[i]+sp; }); return total;
}
if(document.fonts&&document.fonts.load){ document.fonts.load('200 20px "Outfit"'); document.fonts.load('500 20px "Outfit"'); document.fonts.load('400 20px "Noto Sans KR"'); }

/* ---------- 렌더러 ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(1);

const out=$('#out'), octx=out.getContext('2d');
const bloomA=mkCanvas(8,8), bloomB=mkCanvas(8,8);
const grain=(()=>{ const c=mkCanvas(200,200), g=c.getContext('2d'), im=g.createImageData(200,200); const r=rng(5);
  for(let i=0;i<im.data.length;i+=4){ const v=128+(r()-.5)*150; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } g.putImageData(im,0,0); return c; })();

/* =====================================================================
   장면 1 — SUNSET FLIGHT
   ===================================================================== */
function makeCloudTex(seed,pal,kind){
  const strata=kind==='strata';
  const w=strata?1024:1024, h=strata?128:512; const cv=mkCanvas(w,h), g=cv.getContext('2d'); const R=rng(seed);
  const blobs=[]; const n=strata?30:34;
  for(let i=0;i<n;i++){
    const u=R(), bump=Math.sin(Math.PI*u);
    const r=strata? h*(0.16+0.2*R()) : h*(0.13+0.20*R())*(0.5+0.9*bump);
    const cx=w*(0.1+0.8*u);
    const cy=h*(strata?0.56:0.68)-bump*h*(strata?0.10:0.30)*R()-r*0.12;
    const sx=strata?2.6+R()*2.4:1.5+R()*1.1;
    blobs.push({cx,cy,r,sx});
  }
  const blob=(b,col,a,sc,ox,oy)=>{ g.save(); g.translate(b.cx+ox,b.cy+oy); g.scale(b.sx*sc,sc);
    const gr=g.createRadialGradient(0,0,0,0,0,b.r); gr.addColorStop(0,rgba(col,a)); gr.addColorStop(.55,rgba(col,a*.9)); gr.addColorStop(.85,rgba(col,a*.35)); gr.addColorStop(1,rgba(col,0));
    g.fillStyle=gr; g.beginPath(); g.arc(0,0,b.r,0,Math.PI*2); g.fill(); g.restore(); };
  g.globalCompositeOperation='source-over';
  blobs.forEach(b=>blob(b,pal.mid,.96,1,0,0));
  // 평평하고 부드러운 아랫면
  g.globalCompositeOperation='destination-out';
  let gr=g.createLinearGradient(0,h*.70,0,h*.98); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,1)'); g.fillStyle=gr; g.fillRect(0,h*.70,w,h*.3);
  // 아래로 갈수록 그림자
  g.globalCompositeOperation='source-atop';
  gr=g.createLinearGradient(0,h*.30,0,h*.86); gr.addColorStop(0,rgba(pal.shadow,0)); gr.addColorStop(1,rgba(pal.shadow,.62)); g.fillStyle=gr; g.fillRect(0,0,w,h);
  // 뭉치마다 윗면 빛
  blobs.forEach(b=>blob(b,pal.lit,.85,.80,0,-b.r*.32));
  blobs.forEach(b=>blob(b,'#fff6e6',.65,.44,0,-b.r*.50));
  blobs.forEach(b=>blob(b,pal.shadow,.18,.6,0,b.r*.42));
  // 뭉치 사이 미세한 그늘
  for(let i=0;i<14;i++){ const b=blobs[(R()*blobs.length)|0]; blob({cx:b.cx+(R()-.5)*b.r*2,cy:b.cy+b.r*.25,r:b.r*.55,sx:b.sx},pal.shadow,.16,1,0,0); }
  // 가장자리 페이드
  g.globalCompositeOperation='destination-in';
  gr=g.createLinearGradient(0,0,w,0); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.14,'rgba(0,0,0,1)'); gr.addColorStop(.86,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h);
  gr=g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.12,'rgba(0,0,0,1)'); gr.addColorStop(.9,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h);
  return srgbTex(cv);
}

function buildSunset(){
  const cfg=CONFIG.sunset, P=cfg.palette, T=cfg.duration, ALT=cfg.altitude;
  const scene=new THREE.Scene(); scene.fog=new THREE.Fog(C(P.fog),110,520);
  const camera=new THREE.PerspectiveCamera(55,9/16,0.1,3000); scene.add(camera);
  const sunDir=new THREE.Vector3(0.97,0.065,-0.20).normalize();

  /* --- 하늘 & 바다 셰이더 --- */
  const skyU={uTop:{value:C(P.skyTop)},uMid:{value:C(P.skyMid)},uHor:{value:C(P.skyHorizon)},uSun:{value:sunDir},uSunCol:{value:C(P.sun)}};
  const skyFn=`
    uniform vec3 uTop,uMid,uHor,uSun,uSunCol;
    vec3 skyBase(vec3 d){
      float h=clamp(d.y,0.0,1.0);
      vec3 c=mix(uHor,uMid,smoothstep(0.0,0.20,h));
      c=mix(c,uTop,smoothstep(0.14,0.85,h));
      float sd=max(dot(d,uSun),0.0);
      c+=uSunCol*(pow(sd,3.0)*0.10+pow(sd,10.0)*0.32+pow(sd,60.0)*0.60);
      return c;
    }
    vec3 skyCol(vec3 d){
      vec3 c=skyBase(d); float sd=max(dot(d,uSun),0.0);
      c+=vec3(1.0,0.93,0.80)*smoothstep(0.9993,0.99975,sd)*4.0; return c;
    }`;
  const sky=new THREE.Mesh(new THREE.SphereGeometry(1500,48,24),new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,uniforms:skyU,
    vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vD; ${skyFn}
      void main(){ vec3 c=skyCol(normalize(vD)); gl_FragColor=vec4(c,1.0);
      #include <tonemapping_fragment>
      #include <encodings_fragment>
      }`
  }));
  sky.frustumCulled=false; sky.renderOrder=-10; scene.add(sky);

  const seaU=Object.assign({uT:{value:0},uCam:{value:new THREE.Vector3()},uDeep:{value:C(P.seaDeep)},uSeaMid:{value:C(P.seaMid)},uGlow:{value:C(P.seaGlow)}},skyU);
  const seaMat=new THREE.ShaderMaterial({
    uniforms:seaU,
    vertexShader:`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader:`
      uniform float uT; uniform vec3 uCam,uDeep,uSeaMid,uGlow; varying vec3 vW;
      const float W0=0.6283185;
      ${skyFn}
      void wv(vec2 p,vec2 d,float f,float n,float a,float att,inout vec2 g){
        vec2 dn=normalize(d); float ph=dot(p,dn)*f+W0*n*uT; g+=dn*f*a*cos(ph)*att;
      }
      void main(){
        vec3 toP=vW-uCam; float dist=length(toP); vec3 V=-toP/dist; vec2 p=vW.xz;
        p+=vec2(1.7*sin(p.y*0.23+W0*uT)+0.9*sin(p.y*0.61-W0*2.0*uT),1.5*cos(p.x*0.19+W0*uT)+0.8*cos(p.x*0.53+W0*2.0*uT));
        float att=1.0/(1.0+dist*0.0030); float attH=att*exp(-dist*0.010);
        vec2 g=vec2(0.0);
        wv(p,vec2(0.2,1.0),0.45,1.0,0.30,att,g);
        wv(p,vec2(-0.5,1.0),0.83,2.0,0.24,att,g);
        wv(p,vec2(0.8,0.6),1.30,2.0,0.15,att,g);
        wv(p,vec2(-0.9,0.4),2.10,3.0,0.09,att,g);
        wv(p,vec2(0.1,-1.0),3.30,3.0,0.055,attH,g);
        wv(p,vec2(0.6,0.9),5.20,4.0,0.030,attH,g);
        wv(p,vec2(-0.7,-0.6),8.50,5.0,0.018,attH,g);
        vec3 n=normalize(vec3(-g.x,1.0,-g.y));
        float ndv=max(dot(n,V),0.0);
        float F=0.03+0.97*pow(1.0-ndv,4.0);
        vec3 R=reflect(-V,n); R.y=abs(R.y)+0.002; R=normalize(R);
        vec3 refl=skyBase(R);
        vec3 body=mix(uDeep,uSeaMid,pow(1.0-ndv,1.5));
        vec3 H=normalize(uSun+V);
        body+=uGlow*pow(max(dot(n,H),0.0),4.0)*0.10;
        vec3 col=mix(body,refl,F);
        float rs=max(dot(R,uSun),0.0);
        col+=uSunCol*(pow(rs,900.0)*4.0+pow(rs,120.0)*0.32)*(0.30+F);
        float fg=1.0-exp(-dist*0.0017);

    return {H,glows:glowList,label:'NEW YORK',
      lights:[{pos:[0,-.1,.55],color:'#ffc27a',i:1.3,d:3.4},{pos:[.2,-1.1,.9],color:'#ffdf9a',i:.8,d:2.2}],
      tick(t){ placeTaxis(t); esbTip.material.emissiveIntensity=1.6+1.2*Math.sin(2*Math.PI*t/2); } }; }

  const CITY_BUILD={seoul:buildSeoul,paris:buildParis,tokyo:buildTokyo,newyork:buildNY};
  function setCityKey(key){
    Object.values(cityCache).forEach(c=>{ c.root.visible=false; });
    let c=cityCache[key];
    if(!c){ const root=new THREE.Group(); rig.add(root); const res=CITY_BUILD[key](root); c=Object.assign({root},res); cityCache[key]=c; }
    c.root.visible=true; activeCity=c; Hcur=c.H;
    [L1,L2].forEach((L,i)=>{ const d=c.lights[i]; L.color.copy(C(d.color)); L.position.set(d.pos[0],d.pos[1],d.pos[2]); L.distance=d.d; L.userData.base=d.i; L.intensity=d.i; });
    return c.label; }
  setCityKey(cfg.cityKey || 'seoul');
  /* --- 눈송이 (구슬 밖으로 새지 않도록 반경 클램프) --- */
  const N=cfg.snowCount, Rn=rng(99);
  const b0=new Float32Array(N*3), par=new Float32Array(N*6), sizes=new Float32Array(N), posArr=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const y=mix(-1.3,1.9,Rn()), rmax=Math.sqrt(Math.max(.01,RIN*RIN-(y-CY)**2)), r=rmax*Math.sqrt(Rn()), a=Rn()*Math.PI*2;
    b0[i*3]=r; b0[i*3+1]=y; b0[i*3+2]=a; // 반경, 높이, 각도
    par[i*6]=.20+Rn()*.24; par[i*6+1]=(.6+Rn()*.9)*(Rn()<.5?1:.85); par[i*6+2]=Rn()*6.28; par[i*6+3]=Rn()*6.28; par[i*6+4]=Rn()*6.28; par[i*6+5]=Rn();
    sizes[i]=.032+Math.pow(Rn(),2.2)*.06; }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(posArr,3)); sg.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
  const snowU={uScale:{value:900},uCol:{value:C(P.snow)}};
  const snow=new THREE.Points(sg,new THREE.ShaderMaterial({uniforms:snowU,transparent:true,depthWrite:false,
    vertexShader:`uniform float uScale; attribute float aSize; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; gl_PointSize=max(1.5,aSize*uScale/(-mv.z)); }`,
    fragmentShader:`uniform vec3 uCol; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,.12,d); if(a<.01) discard; gl_FragColor=vec4(uCol*1.1,a*.95);
      #include <encodings_fragment>
    }`}));
  snow.frustumCulled=false; snow.renderOrder=2; rig.add(snow);
  let shake={t0:0,amp:.4};

  /* --- 유리구슬 (하이라이트는 스튜디오 조명 반사를 수식으로 계산) --- */
  const glassVS=`varying vec3 vN; varying vec3 vW; void main(){ vN=normalize(mat3(modelMatrix)*normal); vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
  const glassFS=`
    uniform vec3 uCam; uniform float uK; varying vec3 vN; varying vec3 vW;
    float rbox(vec2 p,vec2 b,float r){ vec2 d=abs(p)-b+r; return length(max(d,0.0))+min(max(d.x,d.y),0.0)-r; }
    float softbox(vec3 R,vec3 c,vec3 up,vec2 size,float soft,float bars){
      vec3 r=normalize(cross(up,c)); vec3 u=cross(c,r); float d=dot(R,c); if(d<0.05) return 0.0;
      vec2 p=vec2(dot(R,r),dot(R,u))/d; float sd=rbox(p,size,0.05); float m=1.0-smoothstep(-soft,soft,sd);
      float bar=smoothstep(0.014,0.004,abs(p.x))+smoothstep(0.014,0.004,abs(p.y)); return m*(1.0-bars*clamp(bar,0.0,1.0));
    }
    void main(){
      vec3 N=normalize(vN); vec3 V=normalize(uCam-vW); if(!gl_FrontFacing) N=-N;
      float ndv=abs(dot(N,V)); float f=pow(1.0-ndv,3.0);
      vec3 R=reflect(-V,N);
      float win=softbox(R,normalize(vec3(-0.55,0.60,0.62)),vec3(0.0,1.0,0.0),vec2(0.26,0.34),0.03,0.85);
      float strip=softbox(R,normalize(vec3(0.90,0.20,0.32)),vec3(0.0,1.0,0.0),vec2(0.045,0.55),0.02,0.0);
      float top=softbox(R,normalize(vec3(0.05,1.0,0.1)),vec3(0.0,0.0,1.0),vec2(0.45,0.45),0.35,0.0);
      float warm=softbox(R,normalize(vec3(-0.65,-0.35,0.55)),vec3(0.0,1.0,0.0),vec2(0.16,0.12),0.10,0.0);
      vec3 col=vec3(0.0); float a=0.0;
      col+=vec3(1.0,0.96,0.90)*win*1.0; a+=win*0.85;
      col+=vec3(1.0,0.86,0.70)*strip*0.9; a+=strip*0.65;
      col+=vec3(1.0,0.93,0.82)*top*0.35; a+=top*0.18;
      col+=vec3(1.0,0.62,0.34)*warm*0.9; a+=warm*0.4;
      vec3 rimc=mix(vec3(1.0,0.72,0.50),vec3(0.62,0.55,0.85),smoothstep(-0.4,0.8,R.x)); col+=rimc*f; a+=f*0.42;
      float low=smoothstep(0.0,-0.9,R.y); col+=vec3(0.85,0.66,0.46)*low*0.5; a+=low*0.10;
      a=clamp(a,0.0,0.92)*uK; gl_FragColor=vec4(col,a);
      #include <encodings_fragment>
    }`;
  const gU=(k)=>({uCam:{value:new THREE.Vector3()},uK:{value:k}});
  const gBackU=gU(.45), gFrontU=gU(1.0);
  const gGeo=new THREE.SphereGeometry(RAD,96,64);
  const gBack=new THREE.Mesh(gGeo,new THREE.ShaderMaterial({uniforms:gBackU,vertexShader:glassVS,fragmentShader:glassFS,transparent:true,depthWrite:false,side:THREE.BackSide})); gBack.position.y=CY; gBack.renderOrder=1; rig.add(gBack);
  const gFront=new THREE.Mesh(gGeo,new THREE.ShaderMaterial({uniforms:gFrontU,vertexShader:glassVS,fragmentShader:glassFS,transparent:true,depthWrite:false,side:THREE.FrontSide})); gFront.position.y=CY; gFront.renderOrder=3; rig.add(gFront);

  const camTarget=new THREE.Vector3(0,-.42,0);
  function update(t){
    const two=2*Math.PI;
    if(t<shake.t0) shake={t0:0,amp:.4};
    const tau=t-shake.t0, E=Math.exp(-tau/1.45);
    // 카메라 30도 공전 (-15° ↔ +15°) — 8초 주기로 이음새 없이 반복
    const az=(15*Math.PI/180)*Math.sin(two*t/T-Math.PI/2), el=(11+1.3*Math.sin(two*t/T))*Math.PI/180, D=14.6-.35*Math.sin(two*t/T-Math.PI/2);
    camera.position.set(Math.sin(az)*Math.cos(el)*D,camTarget.y+Math.sin(el)*D,Math.cos(az)*Math.cos(el)*D); camera.lookAt(camTarget);
    // 흔들기 직후 미세한 진동
    const jig=shake.amp*Math.exp(-tau*3.4);
    pivot.rotation.z=.055*jig*Math.sin(tau*24); pivot.rotation.x=.03*jig*Math.sin(tau*19+1); pivot.position.x=.05*jig*Math.sin(tau*27);
    // 눈: 소용돌이(E) → 천천히 낙하 → 바닥에 쌓임
    for(let i=0;i<N;i++){
      const r0=b0[i*3], y0=b0[i*3+1], a0=b0[i*3+2], vy=par[i*6], om=par[i*6+1], p1=par[i*6+2], p2=par[i*6+3], p3=par[i*6+4];
      const ang=a0+om*1.45*(1-E)*(1+.5*Math.sin(y0*1.6+p1))+.08*Math.sin(tau*.9+p1);
      const rr=r0*(1+.24*E*Math.sin(tau*2.1+p2));
      let y=y0+.55*E*Math.sin(tau*1.3+p3)-vy*tau*(1-.6*E);
      let x=rr*Math.cos(ang), z=rr*Math.sin(ang);
      let dy=y-CY, d=Math.sqrt(x*x+dy*dy+z*z); if(d>RIN){ const k=RIN/d; x*=k; z*=k; dy*=k; y=CY+dy; }
      const gy=Hcur(x,z)+.035; if(y<gy) y=gy;
      const lim=Math.sqrt(Math.max(.0001,RIN*RIN-(y-CY)*(y-CY))), rx=Math.hypot(x,z); if(rx>lim){ const k=lim/rx; x*=k; z*=k; }
      posArr[i*3]=x; posArr[i*3+1]=y; posArr[i*3+2]=z;
    }
    sg.attributes.position.needsUpdate=true;
    gBackU.uCam.value.copy(camera.position); gFrontU.uCam.value.copy(camera.position);
    if(activeCity){ activeCity.glows.forEach(g=>{ g.sp.material.opacity=g.base*(.88+.12*Math.sin(two*t/4+g.ph)); }); if(activeCity.tick) activeCity.tick(t); }
  }
  return {scene,camera,T,update,exposure:1.12,
    post:{bloom:.16,gradeTop:P.gradeColor,gradeBottom:P.gradeColor,gradeAlpha:.16,vignette:P.vignette,vigAlpha:.55,text:false},
    onLoop(){ shake={t0:0,amp:.4}; },
    reset(){ shake={t0:0,amp:.4}; },
    shake(t){ shake={t0:t,amp:1}; },
    city(key){ const l=setCityKey(key); shake={t0:0,amp:1}; return l; },
    setCity,
    setViewport(h){ snowU.uScale.value=h/(2*Math.tan(camera.fov*Math.PI/360)); }};
}

/* =====================================================================
   재생 컨트롤 / 합성(블룸·색보정·비네트·문구) / 녹화
   ===================================================================== */
const state={ scene:'globe', t:0, playing:true, recording:false, sunsetText:CONFIG.sunset.text, city:CONFIG.globe.city, cityKey:CONFIG.globe.cityKey||'seoul' };
const built={}; let curr=null; let W=540,H=960;
const els={ frame:$('#frame'), stage:$('#stage'), play:$('#btnPlay'), replay:$('#btnReplay'), seek:$('#seek'), time:$('#time'), rec:$('#btnRec'), status:$('#status'),
  inSunset:$('#inSunset'), inCity:$('#inCity'), shake:$('#btnShake'), fSun:$('#fieldSunset'), fGlobe:$('#fieldGlobe'), cityBtns:[...document.querySelectorAll('.cbtn')], tabs:[...document.querySelectorAll('.tab')], controls:$('#controls') };
els.inSunset.value=state.sunsetText; els.inCity.value=state.city;

function setRenderSize(w,h){
  W=w; H=h; out.width=w; out.height=h; renderer.setSize(w,h,false);
  bloomA.width=Math.max(8,w>>2); bloomA.height=Math.max(8,h>>2); bloomB.width=Math.max(8,w>>4); bloomB.height=Math.max(8,h>>4);
  Object.values(built).forEach(b=>b.setViewport(h));
}
function fitFrame(){
  const r=els.stage.getBoundingClientRect(), cs=getComputedStyle(els.stage);
  const cw=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight), ch=r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  let w=Math.min(cw,ch*9/16); w=Math.max(120,w); const h=w*16/9;
  els.frame.style.width=w+'px'; els.frame.style.height=h+'px'; document.documentElement.style.setProperty('--fw',Math.round(w)+'px');
  if(!state.recording){ const dpr=Math.min(window.devicePixelRatio||1,2); let pw=Math.round(w*dpr), ph=Math.round(pw*16/9); if(ph>1920){ ph=1920; pw=1080; } if(pw!==W||ph!==H) setRenderSize(pw,ph); }
}
new ResizeObserver(fitFrame).observe(els.stage); window.addEventListener('resize',fitFrame);

function ensureScene(name){ if(!built[name]){ built[name]=name==='sunset'?buildSunset():buildGlobe(); built[name].setViewport(H); if(name==='globe') built[name].setCity(state.city); } return built[name]; }
function selectScene(name){
  state.scene=name; curr=ensureScene(name); state.t=0; state.playing=true; curr.reset&&curr.reset();
  renderer.toneMappingExposure=curr.exposure;
  els.tabs.forEach(b=>b.setAttribute('aria-selected',String(b.dataset.scene===name)));
  els.fSun.hidden=name!=='sunset'; els.fGlobe.hidden=name!=='globe';
  updatePlayLabel(); setStatus('');
}
function updatePlayLabel(){ els.play.textContent=state.playing?'일시정지':'재생'; }
function setStatus(s){ els.status.textContent=s; }

els.tabs.forEach(b=>b.addEventListener('click',()=>{ if(!state.recording) selectScene(b.dataset.scene); }));
els.play.addEventListener('click',()=>{ state.playing=!state.playing; updatePlayLabel(); });
els.replay.addEventListener('click',()=>{ state.t=0; state.playing=true; curr.reset&&curr.reset(); updatePlayLabel(); });
let wasPlaying=false;
els.seek.addEventListener('pointerdown',()=>{ wasPlaying=state.playing; state.playing=false; updatePlayLabel(); });
els.seek.addEventListener('input',()=>{ state.t=(els.seek.value/1000)*curr.T*0.9999; });
const endSeek=()=>{ if(wasPlaying){ state.playing=true; updatePlayLabel(); } wasPlaying=false; };
els.seek.addEventListener('pointerup',endSeek); els.seek.addEventListener('change',endSeek);
els.inSunset.addEventListener('input',()=>{ state.sunsetText=els.inSunset.value; });
els.inCity.addEventListener('input',()=>{ state.city=els.inCity.value; if(built.globe) built.globe.setCity(state.city); });
els.cityBtns.forEach(b=>b.addEventListener('click',()=>{ if(state.recording) return; const key=b.dataset.city; state.cityKey=key; els.cityBtns.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  const g=ensureScene('globe'); state.t=0; state.playing=true; updatePlayLabel(); const label=g.city(key); state.city=label; els.inCity.value=label; g.setCity(label); setStatus(''); }));
els.shake.addEventListener('click',()=>{ if(built.globe){ built.globe.shake(state.t); if(!state.playing){ state.playing=true; updatePlayLabel(); } } });

/* --- 합성 --- */
function present(t){
  const S=curr, po=S.post, g=octx;
  g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  if(S.compose) S.compose(g,W,H,t); else g.drawImage(renderer.domElement,0,0,W,H);
  // 블룸(축소 후 확대 → 부드러운 광채)
  const a=bloomA.getContext('2d'), b=bloomB.getContext('2d'); a.imageSmoothingEnabled=b.imageSmoothingEnabled=true;
  a.drawImage(out,0,0,bloomA.width,bloomA.height); b.drawImage(bloomA,0,0,bloomB.width,bloomB.height);
  g.globalCompositeOperation='screen'; g.globalAlpha=po.bloom; g.drawImage(bloomB,0,0,W,H); g.globalAlpha=1;
  // 색보정
  g.globalCompositeOperation='soft-light';
  let gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,rgba(po.gradeTop,po.gradeAlpha)); gr.addColorStop(1,rgba(po.gradeBottom,po.gradeAlpha)); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // 비네트
  g.globalCompositeOperation='source-over';
  gr=g.createRadialGradient(W/2,H*.48,Math.min(W,H)*.32,W/2,H*.5,H*.66); gr.addColorStop(0,rgba(po.vignette,0)); gr.addColorStop(1,rgba(po.vignette,po.vigAlpha)); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // 필름 그레인
  g.globalCompositeOperation='overlay'; g.globalAlpha=.07; const ox=(Math.floor(t*24)*37)%200, oy=(Math.floor(t*24)*91)%200;
  for(let x=-ox;x<W;x+=200) for(let y=-oy;y<H;y+=200) g.drawImage(grain,x,y);
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  // 영상 안 문구 (가늘고 작게)
  if(po.text){ const txt=(state.sunsetText||'').trim().toUpperCase();
    if(txt){ const fs=Math.round(W*.027); g.font=`200 ${fs}px Outfit,"Noto Sans KR","Helvetica Neue",sans-serif`; g.textBaseline='alphabetic';
      g.shadowColor='rgba(50,20,60,.45)'; g.shadowBlur=fs*.5; g.fillStyle='rgba(255,246,236,.94)'; drawSpaced(g,txt,W/2,H*.915,fs*.42);
      g.shadowBlur=0; g.fillStyle='rgba(255,246,236,.6)'; g.fillRect(W/2-fs*.9,H*.915-fs*2.2,fs*1.8,Math.max(1,W/540)); } }
}

/* --- 루프 --- */
let last=performance.now();
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000); last=ts;
  if(!curr) return;
  if(state.playing){ state.t+=dt; if(state.t>=curr.T){ state.t-=curr.T; curr.onLoop&&curr.onLoop(); } }
  curr.update(state.t);
  if(curr.scene) renderer.render(curr.scene,curr.camera);
  present(state.t);
  if(document.activeElement!==els.seek) els.seek.value=String(Math.round(state.t/curr.T*1000));
  els.time.textContent=`${state.t.toFixed(1)} / ${curr.T.toFixed(1)}초`;
}

/* --- WebM 저장 --- */
const recMimes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
const canRec=typeof MediaRecorder!=='undefined' && out.captureStream && recMimes.some(m=>MediaRecorder.isTypeSupported(m));
if(!canRec){ els.rec.disabled=true; setStatus('이 브라우저는 WebM 저장을 지원하지 않아요. Chrome·Edge·Firefox에서 열어 주세요.'); }
async function saveBlob(blob,filename){
  try{ if(window.claude&&window.claude.use){ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename,data:blob}); return 'saved'; } } }
  catch(e){ if(e&&e.code==='declined') return 'declined'; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000); return 'anchor';
}
els.rec.addEventListener('click',()=>{
  if(!canRec||state.recording) return;
  const S=curr, name=state.scene, mime=recMimes.find(m=>MediaRecorder.isTypeSupported(m));
  state.recording=true; els.rec.disabled=true; els.replay.disabled=true; els.play.disabled=true; els.seek.disabled=true; els.tabs.forEach(b=>b.disabled=true);
  const prev={w:W,h:H}; setRenderSize(720,1280); state.t=0; state.playing=true; S.reset&&S.reset(); updatePlayLabel();
  const stream=out.captureStream(30); const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000}); const chunks=[];
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const t0=performance.now(); const tick=setInterval(()=>setStatus(`녹화 중… ${Math.min(S.T,(performance.now()-t0)/1000).toFixed(1)} / ${S.T}초`),200);
  mr.onstop=async()=>{ clearInterval(tick);
    const blob=new Blob(chunks,{type:'video/webm'});
    state.recording=false; els.rec.disabled=false; els.replay.disabled=false; els.play.disabled=false; els.seek.disabled=false; els.tabs.forEach(b=>b.disabled=false); fitFrame();
    if(!blob.size){ setStatus('녹화에 실패했어요. 다시 시도해 주세요.'); return; }
    const fname=name==='sunset'?'sunset-flight.webm':`snow-globe-${state.cityKey}.webm`;
    const res=await saveBlob(blob,fname);
    setStatus(res==='saved'?'WebM을 저장했어요.':res==='declined'?'저장을 취소했어요.':'다운로드를 시작했어요. 저장되지 않으면 새 탭에서 파일을 열어 주세요.'); };
  mr.start(); setTimeout(()=>{ if(mr.state!=='inactive') mr.stop(); },S.T*1000+120);
});

/* --- 시작 --- */
fitFrame(); selectScene('globe'); requestAnimationFrame(frame);
window.__gallery={select:selectScene,state,city:(k)=>{ const b=document.querySelector('[data-city="'+k+'"]'); b&&b.click(); },setT:(t)=>{state.t=t;state.playing=false;updatePlayLabel();}};
}
</script>
